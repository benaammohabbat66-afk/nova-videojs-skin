<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nova Skin — Custom Video.js v10 Theme</title>
<style>
:root{
  --nova-bg:#0d0f1a;--nova-accent:#6c5ce7;--nova-accent2:#a29bfe;
  --nova-glass:rgba(255,255,255,.07);--nova-text:#f5f6fa;--nova-muted:#8a8fa3;
  --nova-bar-h:64px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--nova-bg);color:var(--nova-text)}
body{font-family:'Segoe UI',system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:2rem 0}
h1{font-weight:300;letter-spacing:.05em;margin:0 0 2rem;text-align:center;font-size:clamp(1.3rem,4vw,2rem);padding:0 1rem}
.nova-footer{margin-top:1.25rem;color:var(--nova-muted);font-size:.8rem;text-align:center;padding:0 1rem;letter-spacing:.02em}

/* ---------- Player surface ---------- */
video-player{display:contents}
.nova-skin{position:relative;display:block;width:90vw;max-width:960px;aspect-ratio:16/9;background:var(--nova-bg);overflow:hidden;border-radius:10px;font-family:inherit;color:var(--nova-text);
  box-shadow:0 20px 60px rgba(0,0,0,.45),0 0 0 1px rgba(108,92,231,.18);isolation:isolate}
.nova-skin:fullscreen{width:100%;max-width:none;height:100%;aspect-ratio:auto;border-radius:0}
.nova-skin hls-video,.nova-skin video{position:absolute;inset:0;display:block;width:100%;height:100%;object-fit:contain;background:#000}
.nova-poster{position:absolute;inset:0;transition:opacity .25s;pointer-events:none}
.nova-poster img{width:100%;height:100%;object-fit:cover;display:block}
.nova-poster:not([data-visible]){opacity:0}

/* ---------- Big centered play button ---------- */
.nova-big-play{position:absolute;top:50%;left:50%;z-index:3;width:64px;height:64px;margin:-32px 0 0 -32px;display:grid;place-items:center;
  background:var(--nova-accent);color:#fff;border:2px solid rgba(255,255,255,.25);border-radius:50%;cursor:pointer;
  box-shadow:0 0 24px rgba(108,92,231,.5);transition:transform .15s,box-shadow .15s,opacity .25s}
.nova-big-play:hover{transform:scale(1.08);box-shadow:0 0 40px rgba(108,92,231,.7)}
.nova-big-play svg{width:28px;height:28px;margin-left:3px}
.nova-big-play:not([data-paused]){opacity:0;pointer-events:none;transform:scale(.9)}
.nova-big-play[data-ended] svg{margin-left:0}

/* ---------- Buffering spinner ---------- */
.nova-buffering{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;z-index:2}
.nova-buffering:not([data-visible]){display:none}
.nova-spinner{width:48px;height:48px;border-radius:50%;border:3px solid rgba(162,155,254,.2);border-top-color:var(--nova-accent2);animation:nova-spin .8s linear infinite}
@keyframes nova-spin{to{transform:rotate(360deg)}}

/* ---------- Glass control bar ---------- */
.nova-controls{position:absolute;inset:auto 0 0 0;z-index:4;pointer-events:none;transition:opacity .25s}
.nova-controls:not([data-visible]):not(:has(:focus-visible)){opacity:0}
.nova-bar{pointer-events:auto;display:flex;align-items:center;gap:.15rem;height:var(--nova-bar-h);padding:0 .6rem;
  background:var(--nova-glass);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  border-top:1px solid rgba(108,92,231,.35)}

/* buttons */
.nova-btn{display:inline-grid;place-items:center;flex:none;background:none;border:none;cursor:pointer;padding:.45rem .6rem;margin:0;color:var(--nova-muted);transition:color .2s;border-radius:6px;font:inherit;line-height:1;min-width:44px;min-height:44px}
.nova-btn:hover{color:var(--nova-accent2)}
.nova-btn svg{width:22px;height:22px;display:block;fill:currentColor}
.nova-btn[data-hidden],[hidden]{display:none!important}

/* icon state switching */
.nova-play .i-pause,.nova-play .i-replay,
.nova-play:not([data-paused]) .i-play,.nova-play[data-ended] .i-play,
.nova-play[data-ended] .i-pause{display:none}
.nova-play:not([data-paused]):not([data-ended]) .i-pause{display:block}
.nova-play[data-ended] .i-replay{display:block}
.nova-big-play .i-pause,.nova-big-play .i-replay,.nova-big-play[data-ended] .i-play{display:none}
.nova-big-play[data-ended] .i-replay{display:block}
.nova-mute .i-off,.nova-mute .i-low{display:none}
.nova-mute[data-muted] .i-high,.nova-mute[data-volume-level="off"] .i-high,
.nova-mute[data-volume-level="low"] .i-high{display:none}
.nova-mute[data-muted] .i-off,.nova-mute[data-volume-level="off"] .i-off{display:block}
.nova-mute[data-volume-level="low"]:not([data-muted]) .i-low{display:block}
.nova-mute[data-muted],.nova-mute[data-volume-level="off"]{color:var(--nova-accent2)}
.nova-fs .i-exit{display:none}
.nova-fs[data-fullscreen] .i-enter{display:none}
.nova-fs[data-fullscreen] .i-exit{display:block}

/* ---------- Progress / seek bar ---------- */
.nova-progress{position:relative;flex:1 1 auto;min-width:48px;display:flex;align-items:center;height:100%;padding:0;margin:0 .75rem;cursor:pointer;touch-action:none}
.nova-track{position:relative;width:100%;height:6px;background:rgba(255,255,255,.12);border-radius:3px;overflow:hidden}
.nova-buffer,.nova-fill{position:absolute;top:0;bottom:0;left:0;border-radius:3px;background:linear-gradient(90deg,var(--nova-accent),var(--nova-accent2))}
.nova-buffer{width:var(--media-slider-buffer,0%);opacity:.35}
.nova-fill{width:var(--media-slider-fill,0%)}
.nova-thumb{position:absolute;top:50%;left:var(--media-slider-fill,0%);width:14px;height:14px;border-radius:50%;background:var(--nova-accent2);
  box-shadow:0 0 10px rgba(162,155,254,.8);transform:translate(-50%,-50%);transition:transform .15s}
.nova-progress[data-interactive] .nova-thumb,.nova-progress:hover .nova-thumb{transform:translate(-50%,-50%) scale(1.2)}

/* ---------- Volume ---------- */
.nova-volume-group{display:flex;align-items:center;flex:none}
.nova-volume{position:relative;display:flex;align-items:center;width:64px;height:24px;margin:0 .4rem 0 .1rem;cursor:pointer;touch-action:none}
.nova-volume-track{position:relative;width:100%;height:4px;background:rgba(255,255,255,.18);border-radius:2px;overflow:hidden}
.nova-volume-fill{position:absolute;inset:0 auto 0 0;width:var(--media-slider-fill,0%);background:var(--nova-accent2);border-radius:2px}
.nova-volume-thumb{position:absolute;top:50%;left:var(--media-slider-fill,0%);width:10px;height:10px;border-radius:50%;background:var(--nova-accent2);transform:translate(-50%,-50%);box-shadow:0 0 6px rgba(162,155,254,.7);opacity:0;transition:opacity .15s}
.nova-volume[data-interactive] .nova-volume-thumb,.nova-volume:hover .nova-volume-thumb{opacity:1}

/* ---------- Time ---------- */
.nova-time{display:inline-flex;align-items:center;gap:.3rem;flex:none;font-variant-numeric:tabular-nums;font-size:.8rem;color:var(--nova-muted);padding:.45rem .7rem;min-width:110px;justify-content:center;white-space:nowrap}

/* ---------- Playback rate ---------- */
.nova-rate{min-width:3.2rem;min-height:44px;font-size:.8rem;font-weight:600;font-variant-numeric:tabular-nums}
.nova-rate::after{content:attr(data-rate) "\00D7"}

/* ---------- Focus ---------- */
.nova-skin :focus{outline:none}
.nova-skin :focus-visible{outline:2px solid var(--nova-accent2);outline-offset:2px}
.nova-progress:focus-visible,.nova-volume:focus-visible{outline-offset:-2px;border-radius:6px}
.nova-big-play:focus-visible{outline-offset:4px}

/* ---------- Error dialog ---------- */
.nova-error{position:absolute;inset:0;z-index:6;display:grid;gap:12px;place-content:center;padding:24px;background:rgba(13,15,26,.9);color:var(--nova-text);text-align:center;backdrop-filter:blur(8px)}
.nova-error:not([data-open]){display:none}
.nova-error media-dialog-close{justify-self:center;padding:.5rem 1rem;border-radius:999px;background:var(--nova-accent);color:#fff;cursor:pointer}
.nova-announcer{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- Responsive ---------- */
@media (max-width:600px){
  :root{--nova-bar-h:52px}
  .nova-volume{display:none}
  .nova-time{min-width:0;padding:.45rem .25rem;font-size:.75rem}
  .nova-btn{padding:.25rem}
  .nova-btn svg{width:20px;height:20px}
  .nova-rate{min-width:44px}
}
@media (prefers-reduced-motion:reduce){
  .nova-big-play,.nova-big-play:hover,.nova-thumb,.nova-controls,.nova-btn,.nova-poster,.nova-volume-thumb{transition:none;animation:none}
  .nova-spinner{animation-duration:2.4s}
}
</style>
</head>
<body>
<h1>NOVA — Video.js Custom Skin</h1>

<video-player>
  <media-container class="nova-skin">
    <hls-video src="https://stream.mux.com/W5K9jJ971bO4ZDoEInbVmf5YIV00QmTwsZ633YIAJdYs.m3u8" playsinline preload="auto" crossorigin="anonymous"></hls-video>

    <media-poster class="nova-poster">
      <img src="https://image.mux.com/W5K9jJ971bO4ZDoEInbVmf5YIV00QmTwsZ633YIAJdYs/thumbnail.webp?width=1280" alt="">
    </media-poster>

    <media-buffering-indicator class="nova-buffering"><div class="nova-spinner"></div></media-buffering-indicator>

    <media-play-button class="nova-big-play">
      <svg class="i-play" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M8 5.14v13.72a1 1 0 0 0 1.5.86l11-6.86a1 1 0 0 0 0-1.72l-11-6.86A1 1 0 0 0 8 5.14Z"/></svg>
      <svg class="i-replay" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 5V2L7 6l5 4V7a5 5 0 1 1-5 5H5a7 7 0 1 0 7-7Z"/></svg>
      <svg class="i-pause" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M7 5h3v14H7zM14 5h3v14h-3z"/></svg>
    </media-play-button>

    <media-controls>
      <media-controls-content class="nova-controls">
        <media-controls-group class="nova-bar" aria-label="Playback controls">
          <media-play-button class="nova-btn nova-play">
            <svg class="i-play" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.14v13.72a1 1 0 0 0 1.5.86l11-6.86a1 1 0 0 0 0-1.72l-11-6.86A1 1 0 0 0 8 5.14Z"/></svg>
            <svg class="i-pause" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 5h3v14H7zM14 5h3v14h-3z"/></svg>
            <svg class="i-replay" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5V2L7 6l5 4V7a5 5 0 1 1-5 5H5a7 7 0 1 0 7-7Z"/></svg>
          </media-play-button>

          <media-time-slider class="nova-progress">
            <media-slider-track class="nova-track">
              <media-slider-buffer class="nova-buffer"></media-slider-buffer>
              <media-slider-fill class="nova-fill"></media-slider-fill>
            </media-slider-track>
            <media-slider-thumb class="nova-thumb"></media-slider-thumb>
          </media-time-slider>

          <div class="nova-volume-group">
            <media-mute-button class="nova-btn nova-mute">
              <svg class="i-high" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9v6h4l5 5V4L7 9H3Zm13.5 3A4.5 4.5 0 0 0 14 8v8a4.47 4.47 0 0 0 2.5-4ZM14 3.23v2.06a7 7 0 0 1 0 13.42v2.06a9 9 0 0 0 0-17.54Z"/></svg>
              <svg class="i-low" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 9v6h4l5 5V4L9 9H5Zm13.5 3A4.5 4.5 0 0 0 16 8v8a4.47 4.47 0 0 0 2.5-4Z"/></svg>
              <svg class="i-off" viewBox="0 0 24 24" aria-hidden="true"><path d="M16.5 12A4.5 4.5 0 0 0 14 8v2.18l2.45 2.45c.03-.2.05-.41.05-.63ZM19 12c0 .94-.2 1.82-.54 2.64l1.51 1.51A8.8 8.8 0 0 0 21 12a9 9 0 0 0-7-8.77v2.06A7 7 0 0 1 19 12ZM4.27 3 3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06a9 9 0 0 0 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3ZM12 4 9.91 6.09 12 8.18V4Z"/></svg>
            </media-mute-button>
            <media-volume-slider class="nova-volume">
              <media-slider-track class="nova-volume-track">
                <media-slider-fill class="nova-volume-fill"></media-slider-fill>
              </media-slider-track>
              <media-slider-thumb class="nova-volume-thumb"></media-slider-thumb>
            </media-volume-slider>
          </div>

          <media-time-group class="nova-time">
            <media-time type="current"></media-time>
            <media-time-separator></media-time-separator>
            <media-time type="duration"></media-time>
          </media-time-group>

          <media-playback-rate-button class="nova-btn nova-rate" rates="0.5 1 1.5 2"></media-playback-rate-button>

          <media-fullscreen-button class="nova-btn nova-fs">
            <svg class="i-enter" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 5h5V3H3v7h2V5Zm9-2v2h5v5h2V3h-7ZM5 14H3v7h7v-2H5v-5Zm14 5h-5v2h7v-7h-2v5Z"/></svg>
            <svg class="i-exit" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 8H3v2h7V3H8v5Zm8 0V3h-2v7h7V8h-5ZM3 16h5v5h2v-7H3v2Zm11 5h2v-5h5v-2h-7v7Z"/></svg>
          </media-fullscreen-button>
        </media-controls-group>
      </media-controls-content>
    </media-controls>

    <media-gesture type="tap" action="togglePaused" pointer="mouse" region="center"></media-gesture>
    <media-gesture type="tap" action="toggleControls" pointer="touch"></media-gesture>
    <media-gesture type="doubletap" action="toggleFullscreen" region="center"></media-gesture>

    <media-hotkey keys="Space" action="togglePaused"></media-hotkey>
    <media-hotkey keys="k" action="togglePaused"></media-hotkey>
    <media-hotkey keys="m" action="toggleMuted"></media-hotkey>
    <media-hotkey keys="f" action="toggleFullscreen"></media-hotkey>
    <media-hotkey keys="ArrowLeft" action="seekStep" value="-5"></media-hotkey>
    <media-hotkey keys="ArrowRight" action="seekStep" value="5"></media-hotkey>
    <media-hotkey keys="ArrowUp" action="volumeStep"></media-hotkey>
    <media-hotkey keys="ArrowDown" action="volumeStep"></media-hotkey>
    <media-hotkey keys="&gt;" action="speedUp"></media-hotkey>
    <media-hotkey keys="&lt;" action="speedDown"></media-hotkey>

    <media-status-announcer class="nova-announcer"></media-status-announcer>

    <media-error-dialog>
      <media-dialog-popup class="nova-error">
        <media-dialog-title></media-dialog-title>
        <media-dialog-description></media-dialog-description>
        <media-dialog-close>Dismiss</media-dialog-close>
      </media-dialog-popup>
    </media-error-dialog>
  </media-container>
</video-player>

<p class="nova-footer">Nova — a dark glassmorphic Video.js v10 skin by Abdul Kalam (@AKMuhammadadAli) · #videojsskinschallenge</p>

<script>
/* Fallback: if the Mux HLS stream can't load (network/codec), swap to the MP4 source. */
(function(){
  var m=document.querySelector('hls-video');
  if(!m) return;
  var swapped=false;
  function ok(){ return m.readyState>0 || (m.duration>0 && isFinite(m.duration)); }
  function fallback(){
    if(swapped||ok()) return; swapped=true;
    var wasPlaying=!m.paused;
    var v=document.createElement('video');
    v.setAttribute('playsinline','');v.setAttribute('preload','auto');
    v.src='https://vjs.zencdn.net/v/oceans.mp4';
    m.replaceWith(v);
    if(wasPlaying){ var p=v.play(); if(p&&p.catch) p.catch(function(){}); }
  }
  m.addEventListener('error',fallback);
  setTimeout(fallback,8000);
  m.addEventListener('waiting',function(){ setTimeout(fallback,6000); });
})();
</script>
